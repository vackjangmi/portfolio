<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>평면도 가구 배치 도구</title>
<style>
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;background:#eef1f5;color:#172033}
  .boot{min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center}.boot strong{display:block;font-size:18px;margin-bottom:8px}.boot span{font-size:13px;color:#667085}.boot.error{color:#b42318}
</style>
</head>
<body>
<div class="boot" id="boot"><div><strong>평면도 편집기 불러오는 중…</strong><span>모바일 화면을 준비하고 있습니다.</span></div></div>
<script>
(async()=>{
  try{
    const response=await fetch('./legacy-v15.html?v=16',{cache:'no-store'});
    if(!response.ok) throw new Error('기본 편집기를 불러오지 못했습니다.');
    let source=await response.text();
    source=source.replace('</head>','<link rel="stylesheet" href="./mobile.css?v=16"></head>');
    source=source.replace('</body>','<script src="./mobile.js?v=16"><\\/script></body>');
    document.open();
    document.write(source);
    document.close();
  }catch(error){
    const boot=document.getElementById('boot');
    boot.classList.add('error');
    boot.innerHTML='<div><strong>편집기를 불러오지 못했습니다.</strong><span>'+String(error.message||error)+'</span></div>';
  }
})();
</script>
</body>
</html>
