<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>평면도 가구 배치 도구</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dfe4eb;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif}
  #editor{position:fixed;inset:0;width:100%;height:100%;border:0;background:#dfe4eb}
  #loading{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#eef1f5;color:#172033;text-align:center;padding:24px;transition:opacity .15s ease}
  #loading.hidden{opacity:0;pointer-events:none}
  #loading strong{display:block;font-size:18px;margin-bottom:7px}
  #loading span{font-size:13px;color:#667085}
  #loading.error strong{color:#b42318}
</style>
</head>
<body>
<iframe id="editor" src="./legacy-v15.html?v=17" title="평면도 가구 배치 편집기"></iframe>
<div id="loading"><div><strong>평면도 편집기 불러오는 중…</strong><span>모바일/데스크톱 화면을 준비하고 있습니다.</span></div></div>
<script>
(() => {
  const VERSION = '17';
  const frame = document.getElementById('editor');
  const loading = document.getElementById('loading');
  const asset = name => new URL(`./${name}?v=${VERSION}`, location.href).href;

  function fail(message) {
    loading.classList.add('error');
    loading.innerHTML = `<div><strong>편집기를 준비하지 못했습니다.</strong><span>${message}</span></div>`;
  }

  frame.addEventListener('load', () => {
    try {
      const doc = frame.contentDocument;
      if (!doc || !doc.head || !doc.body) throw new Error('편집기 문서에 접근할 수 없습니다.');

      let viewport = doc.querySelector('meta[name="viewport"]');
      if (!viewport) {
        viewport = doc.createElement('meta');
        viewport.name = 'viewport';
        doc.head.appendChild(viewport);
      }
      viewport.content = 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';

      const link = doc.createElement('link');
      link.rel = 'stylesheet';
      link.href = asset('mobile.css');
      doc.head.appendChild(link);

      const script = doc.createElement('script');
      script.src = asset('mobile.js');
      script.onload = () => {
        loading.classList.add('hidden');
        setTimeout(() => loading.remove(), 220);
      };
      script.onerror = () => fail('모바일 UI 스크립트를 불러오지 못했습니다.');
      doc.body.appendChild(script);
    } catch (error) {
      fail(String(error?.message || error));
    }
  });
})();
</script>
</body>
</html>
